auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # ВНИМАНИЕ: retention сознательно оставлен ЕДИНЫМ — 48 часов для всех уровней.
  # Раздельные политики (retention_stream: ERROR/WARN дольше, DEBUG меньше)
  # рассматривались и были ОТКЛОНЕНЫ — не добавлять без явного запроса.
  retention_period: 48h

compactor:
  working_directory: /loki/compactor
  # Автоматическое удаление старых логов (retention policy).
  retention_enabled: true
  # Через час после «просрочки» данные удаляются физически.
  retention_delete_delay: 1h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
